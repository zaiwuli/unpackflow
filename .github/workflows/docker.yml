name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    needs: smoke-test
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: init/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64

  smoke-test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build local smoke-test image
        run: docker build -f init/docker/Dockerfile -t unpackflow-smoke .

      - name: Start container
        run: |
          mkdir -p .smoke/data .smoke/config
          docker run -d --name unpackflow-smoke \
            -p 5656:5656 \
            -e UN_START_DELAY=1s \
            -e UN_FOLDERS_INTERVAL=1s \
            -v "$PWD/.smoke/data:/data" \
            -v "$PWD/.smoke/config:/config" \
            unpackflow-smoke

      - name: Check health and UI
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5656/health | grep -q '"status":"ok"'; then
              curl --fail --silent http://127.0.0.1:5656/ | grep -q 'UnpackFlow'
              exit 0
            fi
            sleep 1
          done
          docker logs unpackflow-smoke
          exit 1

      - name: Verify automatic data directories
        run: |
          test -d .smoke/data/监控目录
          test -d .smoke/data/解压目录
          test -d .smoke/data/缓存目录
          test -d .smoke/data/归档目录

      - name: Create ZIP fixture
        run: |
          printf '%s' 'UnpackFlow delivery test' > .smoke/delivery-ok.txt
          (cd .smoke && zip -q data/监控目录/delivery-test.zip delivery-ok.txt)
          test -s .smoke/data/监控目录/delivery-test.zip
          ls -l .smoke/data/监控目录/delivery-test.zip

      - name: Verify automatic ZIP extraction
        shell: bash
        run: |
          set +e
          for attempt in $(seq 1 90); do
            result=$(find .smoke/data/解压目录 -type f -name delivery-ok.txt -print -quit)
            if [ -n "$result" ]; then
              if grep --fixed-strings 'UnpackFlow delivery test' "$result"; then
                exit 0
              fi
            fi
            sleep 1
          done
          echo "--- final API status ---"
          curl --silent http://127.0.0.1:5656/api/status || true
          echo "--- smoke directory tree ---"
          find .smoke -maxdepth 5 -type f -print
          echo "--- container logs ---"
          docker logs unpackflow-smoke
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs unpackflow-smoke || true
